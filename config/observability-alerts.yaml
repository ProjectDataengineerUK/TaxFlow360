version: 1.0.0
status: approved
alerts:
  - id: api-error-burn
    severity: critical
    expr: sum(rate(http_server_requests_total{status=~"5.."}[5m])) / sum(rate(http_server_requests_total[5m])) > 0.01
    for: 10m
    runbook: docs/runbooks/observability.md
  - id: api-latency-burn
    severity: high
    expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le,service)) > 0.5
    for: 10m
    runbook: docs/runbooks/observability.md
  - id: kafka-consumer-lag
    severity: high
    expr: taxflow_consumer_lag_seconds > 300
    for: 15m
    runbook: docs/runbooks/observability.md
  - id: reconciliation-critical-divergence
    severity: critical
    expr: taxflow_reconciliation_divergences{severity="critical"} > 0
    for: 5m
    runbook: docs/runbooks/observability.md
  - id: tenant-isolation-denial
    severity: critical
    expr: increase(taxflow_authorization_denied_total{reason="cross_tenant"}[5m]) > 0
    for: 1m
    runbook: docs/runbooks/observability.md
  - id: pipeline-freshness
    severity: high
    expr: taxflow_pipeline_freshness_seconds > 900
    for: 15m
    runbook: docs/runbooks/observability.md
