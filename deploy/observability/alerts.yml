groups:
  - name: taxflow-local-slos
    interval: 30s
    rules:
      - alert: TaxFlowHighErrorRate
        expr: sum(rate(http_server_requests_total{status=~"5.."}[5m])) / sum(rate(http_server_requests_total[5m])) > 0.01
        for: 10m
        labels: {severity: critical}
        annotations: {summary: "TaxFlow API error budget burn", runbook: "docs/runbooks/observability.md"}
      - alert: TaxFlowHighLatency
        expr: histogram_quantile(0.95, sum(rate(http_server_request_duration_seconds_bucket[5m])) by (le,service)) > 0.5
        for: 10m
        labels: {severity: high}
        annotations: {summary: "TaxFlow p95 latency above SLO", runbook: "docs/runbooks/observability.md"}
      - alert: TaxFlowCriticalDivergence
        expr: sum(taxflow_reconciliation_divergences{severity="critical"}) > 0
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "Critical reconciliation divergence", runbook: "docs/runbooks/observability.md"}
