openapi: 3.1.0
info:
  title: TaxFlow 360 API
  version: 1.0.0
servers:
  - url: https://api.example.invalid/v1
paths:
  /transactions:
    post:
      operationId: createTransaction
      security:
        - oauth2: [transactions.write]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaxTransaction'
      responses:
        '202':
          description: Transaction accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptedTransaction'
        '400':
          $ref: '#/components/responses/Problem'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
  /companies/{companyTaxId}/readiness:
    get:
      operationId: getReadiness
      security:
        - oauth2: [readiness.read]
      parameters:
        - name: companyTaxId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Latest readiness assessment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReadinessAssessment'
        '404':
          $ref: '#/components/responses/Problem'
  /companies/{companyTaxId}/tax-simulations:
    post:
      operationId: createTaxSimulation
      security:
        - oauth2: [simulations.write]
      parameters:
        - $ref: '#/components/parameters/CompanyTaxId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TaxSimulationRequest'}
      responses:
        '201':
          description: Immutable deterministic simulation
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxSimulationResult'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '422': {$ref: '#/components/responses/Problem'}
  /companies/{companyTaxId}/tax-simulations/{simulationId}:
    get:
      operationId: getTaxSimulation
      security:
        - oauth2: [simulations.read]
      parameters:
        - $ref: '#/components/parameters/CompanyTaxId'
        - {name: simulationId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Tenant-scoped simulation result
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxSimulationResult'}
        '404': {$ref: '#/components/responses/Problem'}
  /companies/{companyTaxId}/tax-simulations/{simulationId}/comparison:
    get:
      operationId: compareTaxSimulation
      security:
        - oauth2: [simulations.read]
      parameters:
        - $ref: '#/components/parameters/CompanyTaxId'
        - {name: simulationId, in: path, required: true, schema: {type: string}}
      responses:
        '200':
          description: Current, reform and split scenario deltas
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxSimulationComparison'}
        '404': {$ref: '#/components/responses/Problem'}
  /companies/{companyTaxId}/digital-twin/latest:
    get:
      operationId: getLatestDigitalTwinProjection
      security:
        - oauth2: [digital-twin.read]
      parameters:
        - $ref: '#/components/parameters/CompanyTaxId'
        - {$ref: '#/components/parameters/DigitalTwinScenarioId'}
      responses:
        '200':
          description: Latest authorized projection summary
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DigitalTwinProjection'}
        '404': {$ref: '#/components/responses/Problem'}
  /companies/{companyTaxId}/digital-twin/history:
    get:
      operationId: getDigitalTwinHistory
      security:
        - oauth2: [digital-twin.read]
      parameters:
        - $ref: '#/components/parameters/CompanyTaxId'
        - {name: from, in: query, required: false, schema: {type: string, format: date}}
        - {name: to, in: query, required: false, schema: {type: string, format: date}}
      responses:
        '200':
          description: Immutable projection history
          content:
            application/json:
              schema: {type: array, items: {$ref: '#/components/schemas/DigitalTwinProjection'}}
        '404': {$ref: '#/components/responses/Problem'}
  /companies/{companyTaxId}/digital-twin/projections/{projectionId}/curve:
    get:
      operationId: getDigitalTwinCashCurve
      security:
        - oauth2: [digital-twin.read]
      parameters:
        - $ref: '#/components/parameters/CompanyTaxId'
        - {name: projectionId, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/DigitalTwinScenarioId'}
      responses:
        '200':
          description: Daily deterministic cash curve and driver evidence
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DigitalTwinCashCurve'}
        '404': {$ref: '#/components/responses/Problem'}
  /companies/{companyTaxId}/digital-twin/projections/{projectionId}/comparison:
    get:
      operationId: compareDigitalTwinScenarios
      security:
        - oauth2: [digital-twin.read]
      parameters:
        - $ref: '#/components/parameters/CompanyTaxId'
        - {name: projectionId, in: path, required: true, schema: {type: string}}
        - {name: scenarioIds, in: query, required: true, schema: {type: array, minItems: 2, items: {type: string}}}
      responses:
        '200':
          description: Scenario liquidity, float and working-capital comparison
          content:
            application/json:
              schema: {$ref: '#/components/schemas/DigitalTwinComparison'}
        '404': {$ref: '#/components/responses/Problem'}
  /companies/{companyTaxId}/shadow-tax:
    get:
      operationId: listShadowTaxDivergences
      security: [{oauth2: [reconciliation.read]}]
      parameters:
        - {name: companyTaxId, in: path, required: true, schema: {type: string, pattern: '^\d{14}$'}}
        - {$ref: '#/components/parameters/TenantId'}
      responses:
        '200':
          description: Tenant-scoped immutable divergence history
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/ShadowTaxDivergence'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /companies/{companyTaxId}/shadow-tax/{divergenceId}:
    get:
      operationId: getShadowTaxDivergence
      security: [{oauth2: [reconciliation.read]}]
      parameters:
        - {name: companyTaxId, in: path, required: true, schema: {type: string}}
        - {name: divergenceId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/TenantId'}
      responses:
        '200': {description: Divergence evidence, content: {application/json: {schema: {$ref: '#/components/schemas/ShadowTaxDivergence'}}}}
        '404': {$ref: '#/components/responses/Problem'}
  /reconciliations/{idempotencyKey}/reviews:
    post:
      operationId: reviewReconciliation
      security: [{oauth2: [reconciliation.review]}]
      parameters:
        - {name: idempotencyKey, in: path, required: true, schema: {type: string}}
        - {$ref: '#/components/parameters/TenantId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, justification, evidenceIds]
              properties:
                decision: {type: string, enum: [RESOLVED, INVALIDATED]}
                justification: {type: string, minLength: 1}
                evidenceIds: {type: array, items: {type: string}}
      responses:
        '201': {description: Immutable human decision recorded}
        '403': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
  /regulatory/authorities:
    get:
      operationId: listRegulatoryAuthorities
      security: [{oauth2: [regulatory.read]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      responses:
        '200':
          description: Approved official authorities and canonical origins
          content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RegulatoryAuthority'}}}}
  /regulatory/answer:
    post:
      operationId: answerRegulatoryQuestion
      security: [{oauth2: [regulatory.read]}]
      parameters: [{$ref: '#/components/parameters/TenantId'}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [question, cutoff_at, authority_ids, document_types, jurisdiction]
              properties:
                question: {type: string, minLength: 1}
                cutoff_at: {type: string, format: date-time}
                authority_ids: {type: array, minItems: 1, items: {type: string}}
                document_types: {type: array, minItems: 1, items: {type: string}}
                jurisdiction: {type: string}
      responses:
        '200': {description: Cited answer, conflict, or explicit refusal, content: {application/json: {schema: {$ref: '#/components/schemas/RegulatoryAnswer'}}}}
        '403': {$ref: '#/components/responses/Problem'}
  /regulatory/changes/{changeId}:
    get:
      operationId: getRegulatoryChangeHistory
      security: [{oauth2: [regulatory.read]}]
      parameters:
        - {name: changeId, in: path, required: true, schema: {type: string, format: uuid}}
        - {$ref: '#/components/parameters/TenantId'}
      responses:
        '200': {description: Immutable change history, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/RegulatoryChange'}}}}}
        '404': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    oauth2:
      type: oauth2
      flows:
        clientCredentials:
          tokenUrl: https://identity.example.invalid/oauth2/token
          scopes:
            transactions.write: Submit transactions
            readiness.read: Read readiness results
            simulations.write: Create tax simulations
            simulations.read: Read tax simulations and comparisons
            digital-twin.read: Read Digital Twin projections and evidence
            reconciliation.read: Read tenant-scoped Shadow Tax divergences
            reconciliation.review: Decide authorized reconciliation reviews
            regulatory.read: Search and read cited regulatory evidence
            regulatory.review: Submit and approve regulatory change requests
  parameters:
    TenantId:
      name: X-Tenant-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    CompanyTaxId:
      name: companyTaxId
      in: path
      required: true
      schema: {type: string, minLength: 11, maxLength: 14}
    DigitalTwinScenarioId:
      name: scenarioId
      in: query
      required: false
      schema: {type: string, default: baseline}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 200
  responses:
    Problem:
      description: RFC 9457 problem response
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    TaxTransaction:
      type: object
      additionalProperties: false
      required: [taxTransactionId, companyTaxId, sourceSystem, sourceEventId, occurredAt, operationAmount, currency]
      properties:
        taxTransactionId:
          type: string
          minLength: 1
        companyTaxId:
          type: string
          minLength: 11
          maxLength: 14
        sourceSystem:
          type: string
          minLength: 1
        sourceEventId:
          type: string
          minLength: 1
        occurredAt:
          type: string
          format: date-time
        operationAmount:
          type: string
          pattern: '^\d+(\.\d{1,2})?$'
        currency:
          type: string
          const: BRL
    AcceptedTransaction:
      type: object
      required: [taxTransactionId, status]
      properties:
        taxTransactionId:
          type: string
        status:
          type: string
          const: accepted
    ReadinessAssessment:
      type: object
      required: [companyTaxId, score, assessedAt, dimensions]
      properties:
        companyTaxId:
          type: string
        score:
          type: number
          minimum: 0
          maximum: 100
        assessedAt:
          type: string
          format: date-time
        dimensions:
          type: object
          additionalProperties:
            type: number
            minimum: 0
            maximum: 100
    TaxSimulationRequest:
      type: object
      additionalProperties: false
      required: [taxTransactionId, operationAmount, occurredAt, scenarios, ruleSetVersion]
      properties:
        taxTransactionId: {type: string, minLength: 1}
        operationAmount: {type: string, pattern: '^\d+(\.\d{1,2})?$'}
        occurredAt: {type: string, format: date-time}
        scenarios:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items: {type: string, enum: [current, reform, split]}
        ruleSetVersion: {type: string, pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'}
        predecessorSimulationId: {type: string}
    OfficialSourceReference:
      type: object
      additionalProperties: false
      required: [sourceId, sourceUrl, authority, documentId, provision, publicationDate, capturedAt, contentSha256, status]
      properties:
        sourceId: {type: string, minLength: 1}
        sourceUrl: {type: string, format: uri, pattern: '^https://'}
        authority: {type: string, minLength: 1}
        documentId: {type: string, minLength: 1}
        provision: {type: string, minLength: 1}
        publicationDate: {type: string, format: date}
        capturedAt: {type: string, format: date-time}
        contentSha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        status: {type: string, const: validated}
    TaxComponentResult:
      type: object
      required: [component, base, rate, amount, ruleId, sourceIds]
      properties:
        component: {type: string}
        base: {type: string, pattern: '^\d+\.\d{2}$'}
        rate: {type: string}
        amount: {type: string, pattern: '^\d+\.\d{2}$'}
        ruleId: {type: string}
        sourceIds: {type: array, minItems: 1, items: {type: string}}
    TaxScenarioResult:
      type: object
      required: [scenario, totalTax, companyAmount, authorityAmount, components]
      properties:
        scenario: {type: string, enum: [current, reform, split]}
        totalTax: {type: string, pattern: '^\d+\.\d{2}$'}
        companyAmount: {type: string, pattern: '^\d+\.\d{2}$'}
        authorityAmount: {type: string, pattern: '^\d+\.\d{2}$'}
        components: {type: array, minItems: 1, items: {$ref: '#/components/schemas/TaxComponentResult'}}
    CalculationMemoryEntry:
      type: object
      required: [sequence, scenario, component, formula, inputs, unroundedValue, roundedValue, roundingMode, ruleId]
      properties:
        sequence: {type: integer, minimum: 1}
        scenario: {type: string}
        component: {type: string}
        formula: {type: string}
        inputs: {type: object, additionalProperties: {type: string}}
        unroundedValue: {type: string}
        roundedValue: {type: string, pattern: '^\d+\.\d{2}$'}
        roundingMode: {type: string, const: HALF_EVEN}
        ruleId: {type: string}
    TaxSimulationResult:
      type: object
      additionalProperties: false
      required: [simulationId, companyTaxId, taxTransactionId, cutoffAt, calculatedAt, ruleSetVersion, inputFingerprint, currency, scenarios, calculationMemory, officialSources]
      properties:
        simulationId: {type: string}
        predecessorSimulationId: {type: string}
        companyTaxId: {type: string}
        taxTransactionId: {type: string}
        cutoffAt: {type: string, format: date-time}
        calculatedAt: {type: string, format: date-time}
        ruleSetVersion: {type: string}
        inputFingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        currency: {type: string, const: BRL}
        scenarios: {type: array, minItems: 1, maxItems: 3, items: {$ref: '#/components/schemas/TaxScenarioResult'}}
        calculationMemory: {type: array, minItems: 1, items: {$ref: '#/components/schemas/CalculationMemoryEntry'}}
        officialSources: {type: array, minItems: 1, items: {$ref: '#/components/schemas/OfficialSourceReference'}}
    TaxSimulationComparison:
      type: object
      required: [simulationId, baselineScenario, scenarioDeltas, officialSources]
      properties:
        simulationId: {type: string}
        baselineScenario: {type: string, const: current}
        scenarioDeltas:
          type: array
          items:
            type: object
            required: [scenario, taxDelta, companyCashDelta]
            properties:
              scenario: {type: string}
              taxDelta: {type: string}
              companyCashDelta: {type: string}
        officialSources: {type: array, minItems: 1, items: {$ref: '#/components/schemas/OfficialSourceReference'}}
    DigitalTwinEvidence:
      type: object
      additionalProperties: false
      required: [evidenceId, evidenceType, driver, sourceDataset, sourceRecordId, observedValue, contribution]
      properties:
        evidenceId: {type: string}
        evidenceType: {type: string, enum: [financial_fact, stress_assumption, tax_simulation, model_metric]}
        driver: {type: string}
        sourceDataset: {type: string}
        sourceRecordId: {type: string}
        simulationId: {type: string, description: Required for tax evidence}
        ruleId: {type: string, description: Inherited from the immutable tax simulation}
        sourceIds: {type: array, items: {type: string}, description: Official citation IDs inherited from Wave 3}
        observedValue: {type: string}
        contribution: {type: string}
    DigitalTwinModelEvidence:
      type: object
      additionalProperties: false
      required: [mode, trainingWindowStart, trainingWindowEnd, mape, absoluteBias, intervalCoverage]
      properties:
        mode: {type: string, enum: [deterministic_baseline, promoted_forecast]}
        modelVersion: {type: string}
        trainingWindowStart: {type: string, format: date}
        trainingWindowEnd: {type: string, format: date}
        mape: {type: string, pattern: '^\d+\.\d+$'}
        absoluteBias: {type: string, pattern: '^\d+\.\d+$'}
        intervalCoverage: {type: string, pattern: '^\d+\.\d+$'}
        promotionActor: {type: string}
        fallbackReason: {type: string}
    DigitalTwinDailyPoint:
      type: object
      additionalProperties: false
      required: [date, openingCash, inflow, outflow, taxSplitOutflow, closingCash, minimumCash, liquidityGap, taxFloatDelta, workingCapitalNeed, evidence]
      properties:
        date: {type: string, format: date}
        openingCash: {$ref: '#/components/schemas/DecimalMoney'}
        inflow: {$ref: '#/components/schemas/DecimalMoney'}
        outflow: {$ref: '#/components/schemas/DecimalMoney'}
        taxSplitOutflow: {$ref: '#/components/schemas/DecimalMoney'}
        closingCash: {$ref: '#/components/schemas/SignedDecimalMoney'}
        minimumCash: {$ref: '#/components/schemas/DecimalMoney'}
        liquidityGap: {$ref: '#/components/schemas/DecimalMoney'}
        taxFloatDelta: {$ref: '#/components/schemas/SignedDecimalMoney'}
        workingCapitalNeed: {$ref: '#/components/schemas/DecimalMoney'}
        evidence: {type: array, items: {$ref: '#/components/schemas/DigitalTwinEvidence'}}
    DigitalTwinProjection:
      type: object
      additionalProperties: false
      required: [projectionId, companyTaxId, scenarioId, cutoffAt, publishedAt, horizonDays, assumptionVersion, modelEvidence, minimumClosingCash, maximumLiquidityGap, taxFloatDelta, workingCapitalNeed, evidence]
      properties:
        projectionId: {type: string}
        companyTaxId: {type: string}
        scenarioId: {type: string}
        cutoffAt: {type: string, format: date-time}
        publishedAt: {type: string, format: date-time}
        horizonDays: {type: integer, enum: [30, 90, 180, 365]}
        assumptionVersion: {type: string}
        modelEvidence: {$ref: '#/components/schemas/DigitalTwinModelEvidence'}
        minimumClosingCash: {$ref: '#/components/schemas/SignedDecimalMoney'}
        maximumLiquidityGap: {$ref: '#/components/schemas/DecimalMoney'}
        taxFloatDelta: {$ref: '#/components/schemas/SignedDecimalMoney'}
        workingCapitalNeed: {$ref: '#/components/schemas/DecimalMoney'}
        evidence: {type: array, minItems: 1, items: {$ref: '#/components/schemas/DigitalTwinEvidence'}}
        officialSources: {type: array, items: {$ref: '#/components/schemas/OfficialSourceReference'}, description: Resolved only from inherited tax simulation citations}
    DigitalTwinCashCurve:
      type: object
      required: [projectionId, scenarioId, currency, points, modelEvidence]
      properties:
        projectionId: {type: string}
        scenarioId: {type: string}
        currency: {type: string, const: BRL}
        points: {type: array, minItems: 30, items: {$ref: '#/components/schemas/DigitalTwinDailyPoint'}}
        modelEvidence: {$ref: '#/components/schemas/DigitalTwinModelEvidence'}
    DigitalTwinComparison:
      type: object
      required: [projectionId, baselineScenarioId, scenarios]
      properties:
        projectionId: {type: string}
        baselineScenarioId: {type: string}
        scenarios:
          type: array
          minItems: 2
          items:
            type: object
            required: [scenarioId, closingCashDelta, liquidityGapDelta, taxFloatDelta, workingCapitalDelta, driverEvidence]
            properties:
              scenarioId: {type: string}
              closingCashDelta: {$ref: '#/components/schemas/SignedDecimalMoney'}
              liquidityGapDelta: {$ref: '#/components/schemas/SignedDecimalMoney'}
              taxFloatDelta: {$ref: '#/components/schemas/SignedDecimalMoney'}
              workingCapitalDelta: {$ref: '#/components/schemas/SignedDecimalMoney'}
              driverEvidence: {type: array, items: {$ref: '#/components/schemas/DigitalTwinEvidence'}}
    RegulatoryAuthority:
      type: object
      required: [authorityId, name, officialUrl]
      properties:
        authorityId: {type: string}
        name: {type: string}
        officialUrl: {type: string, format: uri}
    RegulatoryAnswer:
      type: object
      required: [disposition, claims, citations, cutoff_at, policy_version, model_version]
      properties:
        disposition: {type: string, enum: [answered, refused, conflicted, failed]}
        reason: {type: [string, 'null']}
        claims: {type: array, items: {type: object}}
        citations: {type: array, items: {type: object}}
        cutoff_at: {type: string, format: date-time}
        policy_version: {type: string}
        model_version: {type: string}
    RegulatoryChange:
      type: object
      required: [change_request_id, tenant_id, version, status, source_document_version_ids, affected_rule_ids, diff_sha256, created_by, golden_tests_passed]
      properties:
        change_request_id: {type: string, format: uuid}
        tenant_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        status: {type: string, enum: [DRAFT, SUBMITTED, APPROVED, REJECTED]}
        source_document_version_ids: {type: array, minItems: 1, items: {type: string}}
        affected_rule_ids: {type: array, items: {type: string}}
        diff_sha256: {type: string, pattern: '^[a-f0-9]{64}$'}
        created_by: {type: string}
        golden_tests_passed: {type: boolean}
    ShadowTaxDivergence:
      type: object
      required: [divergence_id, reconciliation_id, version, tenant_id, company_tax_id, status, absolute_difference, policy_version, fingerprint, logical_cutoff_at, source_event_ids, evidence]
      properties:
        divergence_id: {type: string, format: uuid}
        reconciliation_id: {type: string, format: uuid}
        version: {type: integer, minimum: 1}
        tenant_id: {type: string, format: uuid}
        company_tax_id: {type: string, pattern: '^\d{14}$'}
        status: {type: string, enum: [MATCHED, MATCHED_WITH_TOLERANCE, DIVERGENT, PENDING_HUMAN_REVIEW, RESOLVED, INVALIDATED]}
        divergence_type: {type: [string, 'null']}
        severity: {type: [string, 'null'], enum: [REVIEW, HIGH, CRITICAL, null]}
        absolute_difference: {$ref: '#/components/schemas/DecimalMoney'}
        policy_version: {type: string}
        fingerprint: {type: string, pattern: '^[a-f0-9]{64}$'}
        logical_cutoff_at: {type: string, format: date-time}
        source_event_ids: {type: array, items: {type: string}}
        evidence:
          type: object
          required: [simulation_ids, rule_ids, memory_ids, official_source_ids, official_source_urls]
          properties:
            simulation_ids: {type: array, items: {type: string}}
            rule_ids: {type: array, items: {type: string}}
            memory_ids: {type: array, items: {type: string}}
            official_source_ids: {type: array, items: {type: string}}
            official_source_urls: {type: array, items: {type: string, format: uri}}
    DecimalMoney:
      type: string
      pattern: '^\d+\.\d{2}$'
      examples: ['100000.00']
    SignedDecimalMoney:
      type: string
      pattern: '^-?\d+\.\d{2}$'
      examples: ['-1250.50']
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
