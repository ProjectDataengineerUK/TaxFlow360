[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taxflow-ingestion"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "python-multipart>=0.0.9,<1", "openpyxl>=3.1,<4", "uvicorn>=0.30,<1"]

[project.scripts]
taxflow-ingestion = "taxflow_ingestion.api:run"

[project.optional-dependencies]
dev = ["pytest>=8,<9", "httpx>=0.27,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/taxflow_ingestion"]

[tool.pytest.ini_options]
pythonpath = ["src"]
