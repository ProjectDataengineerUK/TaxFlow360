[project]
name = "taxflow-regulatory"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.10", "pyyaml>=6.0"]
[project.optional-dependencies]
dev = ["pytest>=8.3", "httpx>=0.28"]
[project.scripts]
taxflow-regulatory = "taxflow_regulatory.api:run"
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"
