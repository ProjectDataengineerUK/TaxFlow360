[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "taxflow-query"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "pydantic>=2.9,<3", "uvicorn>=0.30,<1"]

[project.scripts]
taxflow-query = "taxflow_query.api:run"

[tool.hatch.build.targets.wheel]
packages = ["src/taxflow_query"]
