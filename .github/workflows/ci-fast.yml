name: ci-fast
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
jobs:
  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12.8'}
      - run: pip install -r constraints-certification.txt
      - run: PYTHONPATH=services/query-service/src:services/regulatory-service/src:data/databricks/src:tools/certification/src pytest tests -q --ignore=tests/performance/test_regulatory_100k.py --ignore=tests/performance/test_shadow_tax_100k.py
  jvm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.12.1'}
      - run: for d in services/*-service; do test -f "$d/build.gradle.kts" && gradle -p "$d" test; done
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22.14.0', cache: npm, cache-dependency-path: package-lock.json}
      - run: npm ci
      - run: npm --workspace apps/control-tower run typecheck
      - run: npm --workspace apps/control-tower run build
