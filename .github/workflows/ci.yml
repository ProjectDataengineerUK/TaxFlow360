name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tenant-service:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/tenant-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test

  python-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install pydantic fastapi pyyaml pytest
      - run: python -m compileall services data tests
      - run: python -m pytest tests

  readiness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e services/query-service pyyaml pytest httpx
      - run: python -m pytest tests/readiness -q

  tax-simulation-jvm:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [tax-service, payment-service]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - run: gradle test

  tax-simulation-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e services/query-service pyyaml pytest httpx
      - run: python -m pytest tests/golden tests/parity/test_tax_simulation_parity.py tests/security/test_official_source_links.py tests/performance/test_tax_simulation_load.py -q

  digital-twin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
      - run: python -m pip install -e services/query-service pyyaml pytest httpx
      - run: python -m pytest tests/digital_twin -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/control-tower
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm install
      - run: npm run lint
      - run: npm run typecheck

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - run: terraform fmt -check -recursive deploy/terraform
      - run: terraform -chdir=deploy/terraform/tests init -backend=false
      - run: terraform -chdir=deploy/terraform/tests test

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
