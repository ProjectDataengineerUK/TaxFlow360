[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "taxflow-preflight"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["PyYAML>=6.0,<7"]

[project.scripts]
taxflow-preflight = "taxflow_preflight.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
